name: VFX bridge syntax checks

on:
  push:
    branches:
      - vfx-specialization
  pull_request:
    branches:
      - main

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check ia/server.js
          node --check ia/diagnostics.js
          node --check ia/omniRoute.js
          node --check ia/start.js
          node --check ia/projectContextServer.js
      - name: Validate package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('ia/package.json', 'utf8'))"
