name: Apply real Studio test changes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply real Studio test implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          plugin_path = Path('ia/RobloxAIBridgePlugin.lua')
          omni_path = Path('ia/omniRoute.js')
          server_path = Path('ia/server.js')

          plugin = plugin_path.read_text(encoding='utf-8-sig')
          omni = omni_path.read_text(encoding='utf-8-sig')
          server = server_path.read_text(encoding='utf-8-sig')

          new_plugin_test = r'''function ejecutarStudioTest(action)
          	if type(action) ~= "table" then
          		return false
          	end

          	local testId = tostring(action.testId or ("test_" .. tostring(os.time())))
          	local mode = string.lower(tostring(action.mode or action.testMode or "play"))
          	local duration = math.max(3, math.min(120, tonumber(action.duration) or 10))

          	if mode ~= "play" and mode ~= "run" then
          		mode = "play"
          	end

          	print("=================================")
          	print("[Roblox AI] 🧪 INICIANDO PRUEBA REAL DE STUDIO")
          	print("[Roblox AI] Test:", testId)
          	print("[Roblox AI] Modo:", mode)
          	print("[Roblox AI] Duración de observación:", duration, "segundos")
          	print("[Roblox AI] No se inyectará código de prueba.")
          	print("=================================")

          	pcall(function()
          		LogService:ClearOutput()
          	end)

          	local finished = false
          	local executionOk = false
          	local executionResult = nil
          	local executionError = nil

          	local startOk, startError = pcall(function()
          		task.spawn(function()
          			local ok, result = pcall(function()
          				if mode == "run" then
          					return StudioTestService:ExecuteRunModeAsync(action.args)
          				end

          				return StudioTestService:ExecutePlayModeAsync(action.args)
          			end)

          			executionOk = ok
          			executionResult = result

          			if not ok then
          				executionError = tostring(result)
          				warn("[Roblox AI] Error iniciando/ejecutando StudioTestService:", executionError)
          			end

          			finished = true
          		end)
          	end)

          	if not startOk then
          		warn("[Roblox AI] No se pudo iniciar la prueba real:", startError)
          		return false
          	end

          	local deadline = os.clock() + duration
          	while not finished and os.clock() < deadline do
          		task.wait(0.1)
          	end

          	if not finished then
          		pcall(function()
          			if StudioTestService:CanLeaveTest() then
          				StudioTestService:LeaveTest()
          			end
          		end)

          		local stopDeadline = os.clock() + 10
          		while not finished and os.clock() < stopDeadline do
          			task.wait(0.1)
          		end
          	end

          	local logs = obtenerLogsDePrueba()
          	local errors = {}
          	local warnings = {}

          	for _, entry in ipairs(logs) do
          		local message = tostring(entry.message or "")
          		local messageType = string.lower(tostring(entry.messageType or ""))

          		if string.find(messageType, "error", 1, true) then
          			table.insert(errors, message)
          		elseif string.find(messageType, "warning", 1, true) then
          			table.insert(warnings, message)
          		end
          	end

          	local resultData = {
          		testId = testId,
          		mode = mode,
          		duration = duration,
          		executionOk = executionOk and finished,
          		executionResult = executionResult,
          		executionError = executionError,
          		ok = executionOk and finished and #errors == 0,
          		errorCount = #errors,
          		warningCount = #warnings,
          		errors = errors,
          		warnings = warnings,
          		logs = logs
          	}

          	if resultData.ok then
          		print("[Roblox AI] ✅ PRUEBA REAL OK:", testId)
          	else
          		warn("[Roblox AI] ❌ PRUEBA REAL FALLÓ:", testId)
          	end

          	local postOk, postResponse = pcall(function()
          		return HttpService:RequestAsync({
          			Url = TEST_RESULTS_URL,
          			Method = "POST",
          			Headers = {
          				["Content-Type"] = "application/json",
          				["Accept"] = "application/json"
          			},
          			Body = HttpService:JSONEncode(resultData)
          		})
          	end)

          	if not postOk or not postResponse.Success then
          		warn("[Roblox AI] No se pudo enviar resultado de prueba real.")
          	end

          	return resultData.ok
          end

          marker = 'function ejecutarStudioTest(action)'
          pattern = r'function ejecutarStudioTest\(action\).*?\nend\n\nlocal function intentarAccionEmpaquetada'
          plugin_new, count = re.subn(pattern, new_plugin_test + '\n\nlocal function intentarAccionEmpaquetada', plugin, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('No se encontró ejecutarStudioTest en RobloxAIBridgePlugin.lua')
          plugin = plugin_new

          new_omni_test = r'''function normalizarRunStudioTest(action) {
              const numPlayers = Math.max(
                  1,
                  Math.min(
                      8,
                      Number(action.numPlayers || action.players || 2)
                  )
              );

              const duration = Math.max(
                  3,
                  Math.min(
                      120,
                      Number(action.duration || 10)
                  )
              );

              const requestedMode = String(
                  action.mode || action.testMode || "play"
              ).trim().toLowerCase();

              const mode =
                  requestedMode === "run" || requestedMode === "play"
                      ? requestedMode
                      : "play";

              return {
                  type: "run_studio_test",
                  testId: String(
                      action.testId || crearTestId()
                  ),
                  mode,
                  duration,
                  numPlayers,
                  args: action.args ?? null
              };
          }
          '''
          omni_new, count = re.subn(
              r'function normalizarRunStudioTest\(action\) \{.*?\n\}\n\nfunction empaquetarAccionExtendida',
              new_omni_test + '\nfunction empaquetarAccionExtendida',
              omni,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('No se encontró normalizarRunStudioTest en omniRoute.js')
          omni = omni_new

          omni = omni.replace(
              '    "run_studio_test debe probar el comportamiento real del proyecto en Studio.",\n    "Cuando la prueba encuentre errores, esos errores se usarán para generar una corrección.",',
              '    "run_studio_test inicia una prueba REAL de Roblox Studio; no usa serverCode/clientCode ni inyecta código de prueba.",\n    "Usa mode=play o mode=run y una duración de observación. El plugin recopila el Output/LogService real.",\n    "Cuando la prueba encuentre errores o warnings, esos registros se usarán para generar una corrección.",'
          )

          new_server_test = r'''    /*
     * PRUEBA REAL DE STUDIO.
     * No se ejecuta código de prueba temporal.
     * El plugin inicia Play/Run y devuelve el Output real.
     */
    if (
        type ===
        "run_studio_test"
    ) {
        const numPlayers =
            Math.max(
                1,
                Math.min(
                    8,
                    Number(
                        rawAction.numPlayers ||
                        rawAction.players ||
                        2
                    )
                )
            );

        const duration =
            Math.max(
                3,
                Math.min(
                    120,
                    Number(
                        rawAction.duration ||
                        10
                    )
                )
            );

        const requestedMode =
            String(
                rawAction.mode ||
                rawAction.testMode ||
                "play"
            )
                .trim()
                .toLowerCase();

        const mode =
            requestedMode === "run" ||
            requestedMode === "play"
                ? requestedMode
                : "play";

        return {
            type,
            testId:
                String(
                    rawAction.testId ||
                    `test_${Date.now()}_${Math.random()
                        .toString(36)
                        .slice(2, 8)}`
                ),
            mode,
            duration,
            numPlayers,
            args:
                rawAction.args ?? null
        };
    }
'''
          server_new, count = re.subn(
              r'    /\*\n     \* PRUEBA\.\n     \*/\n    if \(\n        type ===\n        "run_studio_test"\n    \) \{.*?\n    \}\n\n    if \(\n        !STANDARD_ACTIONS\.has\(',
              new_server_test + '\n    if (\n        !STANDARD_ACTIONS.has(',
              server,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('No se encontró bloque run_studio_test en server.js')
          server = server_new

          plugin_path.write_text(plugin, encoding='utf-8')
          omni_path.write_text(omni, encoding='utf-8')
          server_path.write_text(server, encoding='utf-8')
          print('Patched real Studio tests successfully.')
          PY

      - name: Commit patched files and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ia/RobloxAIBridgePlugin.lua ia/omniRoute.js ia/server.js
          git commit -m "Ejecutar pruebas reales en Roblox Studio y analizar Output"
          git rm .github/workflows/apply-real-studio-tests.yml
          git commit -m "Eliminar workflow temporal de parcheo"
          git push origin main
